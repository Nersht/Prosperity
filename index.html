function me(){return S.players[S.active]}function them(){return S.players[1-S.active]}function all(){return S.players.flatMap(p=>p.board.map(c=>({c,p})))}

function showMulliganHandoff(){if(onlineMode&&mulliganIndex!==onlineSeat){onlineWait('Waiting for Player '+(mulliganIndex+1)+' to complete their mulligan.');return}dialog(`<h2>Player ${mulliganIndex+1}: Opening hand</h2><p>Pass the device to ${S.players[mulliganIndex].name}. Each player has one free partial mulligan: choose any cards to replace, then keep the new hand.</p><button class="primary" onclick="showMulligan()">Reveal opening hand</button>`)}

function renderMulligan(){const p=S.players[mulliganIndex];dialog(`<h2>${p.name} — Free Mulligan</h2><p>Select any cards to replace. Your replacements are drawn once, and you must keep the result.</p><div class="mullgrid">${p.hand.map(c=>`<button class="mullcard ${mulliganChosen.has(c.uid)?'chosen':''}" onclick="toggleMulligan(${c.uid})"><b>${mulliganChosen.has(c.uid)?'✓ ':''}${c.name}</b><small>${costText(c)} · ${c.type}</small><small>${c.text}</small></button>`).join('')}</div><button class="primary" onclick="confirmMulligan()">${mulliganChosen.size?'Replace '+mulliganChosen.size+' selected':'Keep all 5 cards'}</button>`)}
function toggleMulligan(id){if(mulliganChosen.has(id))mulliganChosen.delete(id);else mulliganChosen.add(id);renderMulligan()}
function confirmMulligan(){if(onlineMode&&mulliganIndex!==onlineSeat)return;let p=S.players[mulliganIndex],replaced=p.hand.filter(c=>mulliganChosen.has(c.uid));p.hand=p.hand.filter(c=>!mulliganChosen.has(c.uid));draw(p,replaced.length);p.deck.push(...replaced);shuffle(p.deck);if(mulliganIndex===0){mulliganIndex=1;publishOnline(true);showMulliganHandoff()}else{S.active=0;onlinePhase='game';beginTurn();publishOnline(true)}}
function beginTurn(){if(onlineMode&&!myOnlineTurn()){onlineWait('Waiting for the active player.');return}hideActions();transaction=null;task=null;updateActionPanel();let p=me();S.round++;p.turns++;if(effective(p)>=8){S.over=true;render();dialog(`<h2>🏆 ${p.name} wins!</h2><p>You began your turn with ${effective(p)} uncorrupted permanents.</p><button class="primary" onclick="newGame()">Play again</button>`);return}p.max=Math.min(10,p.max+1);p.inf=p.max;p.magic=0;p.chaos=0;p.board.forEach(c=>{c.exhausted=false});S.players.forEach(q=>q.board.forEach(c=>c.evasiveUsed=false));if(p.turns>1)draw(p);say(`${p.name} begins turn ${p.turns}.`);render();dialog(`<h2>${p.name}'s Turn</h2><p>Pass the device to the next player. Only reveal the hand once the correct player is ready.</p><p>Victory progress: ${effective(p)} / 8</p><button class="primary" onclick="closeDialog()">Reveal hand & play</button>`)}
function endTurn(){if(onlineMode&&!myOnlineTurn())return;if(choiceBusy||pendingChoices.length){say('Resolve the pending Last Stand or discard first.');return}hideActions();if(task){say('Finish the action or use Cancel action on the right.');return}if(S.over)return;let p=me();for(let c of p.board){if(c.endCoin)p.coins++;if(c.endHeal)c.damage=0}for(let q of S.players)for(let c of q.board)if(c.type==='location')c.damage=0;p.inf=p.magic=p.chaos=0;selected=null;S.active=1-S.active;if(onlineMode){render();publishOnline(true);onlineWait('Your turn ended. Waiting for your opponent.')}else beginTurn()}
function costText(c){let x=c.cost;return [x.i?x.i+'$':'',x.f?x.f+'☀':'',x.g?x.g+'🪙':'',x.c?x.c+'🌀':''].filter(Boolean).join(' ')||'FREE'}
function canPay(x,p=me()){return p.inf>=(x?.i||0)&&faith(p)>=(x?.f||0)&&p.coins>=(x?.g||0)&&p.chaos>=(x?.c||0)}
function pay(x,p=me()){if(!canPay(x,p))return false;p.inf-=x?.i||0;p.coins-=x?.g||0;p.chaos-=x?.c||0;return true}
function choosePayment(x,done,p=me()){if(!pay(x,p)){toast('Not enough Influence, Faith, or Coins.');return}done();render()}
function renderCoinPayment(){}
function changeCoin(id,d){}
function confirmCoins(){}
function cancelCoins(){coinPayment=null;closeDialog()}

function targetable(c,p){return !!(task&&p&&p.board.includes(c)&&task.filter(c,p))}

function cardArt(c){let seed=[...c.name].reduce((a,v)=>a*31+v.charCodeAt(0)>>>0,17),h=seed%360,h2=(h+54)%360;let stars=Array.from({length:17},(_,i)=>{let x=(seed*(i+3)*13+i*37)%300,y=(seed*(i+7)*7+i*29)%130;return `<circle cx="${x}" cy="${y}" r="${i%4===0?1.6:.7}" fill="#cdeeff" opacity=".65"/>`}).join('');let subject=c.type==='vessel'?`<path d="M150 12 L185 84 275 115 178 108 150 131 122 108 25 115 115 84Z" fill="url(#metal)" stroke="#a8eaff" stroke-width="2"/><path d="M150 23 L150 118 M114 86 L186 86" stroke="#55e6ff" stroke-width="4"/><ellipse cx="150" cy="77" rx="12" ry="20" fill="#7defff"/>`:c.type==='character'?`<circle cx="150" cy="40" r="22" fill="url(#metal)" stroke="#b8edff" stroke-width="2"/><path d="M110 130 L119 80 141 69 159 69 181 80 190 130Z" fill="url(#metal)" stroke="#a4dfff" stroke-width="2"/><path d="M128 40 L172 40 M150 72 L150 121 M119 88 L181 88" stroke="#6de5f8" stroke-width="4"/>`:c.type==='location'?`<path d="M55 130 L55 75 100 75 100 44 132 44 150 12 168 44 200 44 200 75 245 75 245 130Z" fill="url(#metal)" stroke="#a8d8ff" stroke-width="2"/><path d="M80 85 V116 M115 63 V118 M150 48 V118 M185 63 V118 M220 85 V116" stroke="#7af2ff" stroke-width="6"/>`:`<circle cx="150" cy="70" r="48" fill="none" stroke="#8feaff" stroke-width="4"/><path d="M150 14 L164 60 210 70 164 80 150 126 136 80 90 70 136 60Z" fill="#b5f3ff" opacity=".9"/>`;return `<svg viewBox="0 0 300 140" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-label="Original sci-fi artwork for ${c.name}"><defs><linearGradient id="sky" x2="1" y2="1"><stop stop-color="hsl(${h},42%,19%)"/><stop offset="1" stop-color="hsl(${h2},65%,8%)"/></linearGradient><linearGradient id="metal" x2="1" y2="1"><stop stop-color="#9aacc8"/><stop offset=".45" stop-color="#2c4969"/><stop offset="1" stop-color="#091827"/></linearGradient></defs><rect width="300" height="140" fill="url(#sky)"/>${stars}<circle cx="255" cy="28" r="24" fill="hsl(${h2},50%,40%)" opacity=".36"/>${subject}<path d="M0 134 Q150 120 300 134" stroke="#4fe0fa" opacity=".5" fill="none"/></svg>`}

function htmlCard(c,zone){let damaged=c.damage>0,mark=task&&targetable(c,owner(c))?' target':'';let guarding=task&&task.message.startsWith('Choose an enemy card to attack')&&owner(c)===them()&&c.keywords?.includes('Guardian');return `<div class="card ${c.type}${c.exhausted?' exhausted':''}${c.corrupt?' corrupted':''}${selected===c.uid?' selected':''}${mark}${guarding?' guardian-alert':''}" ${zone==='hand'?`draggable="true" ondragstart="dragCard(event,${c.uid})"`:''} onclick="cardClick(${c.uid})" ${zone==='hand'?`ondragover="event.preventDefault();event.stopPropagation()" ondrop="dropHand(event,${c.uid})"`: ''} title="${c.name}: ${c.text.replace(/"/g,'&quot;')}">${c.exhausted?`<div class="exhaust-banner">↷ EXHAUSTED</div>`:''}${guarding?'<div class="guardian-shield">🛡 GUARDIAN — ATTACK THIS</div>':''}<div class="ctop"><span class="name">${c.name}</span><span class="cost">${costText(c)}</span></div><div class="art">${cardArt(c)}</div><div class="sub">${c.type.toUpperCase()} · ${c.sub}</div><div class="ability">${c.text}${c.faith?`<div style="color:#f6dca0">☀ Faith ${c.faith}</div>`:''}${c.power?`<div>⚡ ${c.power} Power</div>`:''}${c.corrupt?`<div style="color:#ff9aaa">☠ Corrupted</div>`:''}</div><div class="stats"><span>${c.type==='event'?'EVENT':c.type==='location'?'LOCATION':'⚔ '+atk(c)}</span><span class="${damaged?'hurt':''}">${c.type==='event'?'':`♥ ${Math.max(0,hp(c)-c.damage)}/${hp(c)}`}</span></div></div>`}
function render(){if(!S)return;let p=me(),o=them();if(selected!==null&&!p.hand.some(c=>c.uid===selected)&&!p.board.some(c=>c.uid===selected)){selected=null;hideActions()}$('turn').textContent=`${p.name} · Turn ${p.turns}`;let rs=[];rs.push(`<span>$ Influence <b>${p.inf}/${p.max}</b></span>`);if(faith(p)>0)rs.push(`<span>☀ Faith <b>${faith(p)}</b></span>`);if(p.coins>0)rs.push(`<span>🪙 Coins <b>${p.coins}</b></span>`);if(p.magic>0)rs.push(`<span>🔮 Magic <b>${p.magic}</b></span>`);if(p.chaos>0)rs.push(`<span>🌀 Chaos <b>${p.chaos}</b></span>`);$('resources').innerHTML=rs.join('');$('enemyTitle').textContent=o.name+"'s battlefield";$('enemyScore').textContent=`${effective(o)}/8 · ${o.board.length} cards · ${o.hand.length} in hand`;$('selfTitle').textContent=p.name+"'s battlefield";$('selfScore').textContent=`${effective(p)}/8 · ${p.board.length} cards`;$('enemy').innerHTML=o.board.map(c=>htmlCard(c,'enemy')).join('');$('board').innerHTML=p.board.map(c=>htmlCard(c,'board')).join('');$('hand').innerHTML=(onlineMode&&!myOnlineTurn())?'':p.hand.map(c=>htmlCard(c,'hand')).join('');$('play').disabled=!p.hand.some(c=>c.uid===selected);$('myDiscardCount').textContent='('+p.discard.length+')';$('oppDiscardCount').textContent='('+o.discard.length+')';if(onlineMode&&!onlineReceiving&&onlinePhase==='game'&&myOnlineTurn())publishOnline()}
function cardClick(id){if(onlineMode&&!myOnlineTurn())return;if(choiceBusy&&!task)return;let c=find(id);if(!c)return;if(task){if(targetable(c,owner(c)))task.pick(c,owner(c));else say('Choose a highlighted target, or cancel the action.');return}selected=selected===id?null:id;render();if(selected)showActions(id);else hideActions()}
function hideActions(){$('actionmenu').style.display='none'}
function showActions(id){let c=me().board.find(c=>c.uid===id)||me().hand.find(c=>c.uid===id);if(!c)return;let menu=$('actionmenu'),buttons=[];
 if(me().hand.includes(c))buttons.push('<button onclick="hideActions();playSelected()">✦ Play card</button>');
 else {if(['character','vessel'].includes(c.type)&&!c.exhausted&&!c.cannotAttack)buttons.push('<button onclick="hideActions();attackSelected()">⚔ Attack</button>');if(c.act&&(!c.exhausted||c.act==='market'||c.act==='guard'))buttons.push(`<button onclick="hideActions();activateSelected()">${c.act==='guard'?'🛡 Exhaust Vault + 1 Coin → Power':'✧ Use ability'}</button>`)}
 if(!buttons.length){hideActions();return}menu.innerHTML=`<strong>${c.name}</strong>${buttons.join('')}<button onclick="hideActions()">Close</button>`;menu.style.display='flex';let card=[...document.querySelectorAll('.card')].find(el=>el.getAttribute('onclick')===`cardClick(${id})`);if(!card)return;let r=card.getBoundingClientRect(),mw=164;menu.style.left=Math.max(6,Math.min(window.innerWidth-mw-6,r.right+7>window.innerWidth-mw?r.left-mw-7:r.right+7))+'px';menu.style.top=Math.max(5,Math.min(window.innerHeight-170,r.top+5))+'px'}
function dropHand(e,id){if(onlineMode&&!myOnlineTurn())return;e.preventDefault();e.stopPropagation();let from=Number(e.dataTransfer.getData('text/plain'));let hand=me().hand;let i=hand.findIndex(c=>c.uid===from),j=hand.findIndex(c=>c.uid===id);if(i<0||j<0||i===j)return;let [card]=hand.splice(i,1);hand.splice(j,0,card);selected=null;hideActions();render()}
function dragCard(e,id){selected=id;e.dataTransfer.setData('text/plain',String(id));e.dataTransfer.effectAllowed='move'}function allowDrop(e){e.preventDefault();e.currentTarget.classList.add('drop')}function dropPlay(e){e.preventDefault();e.currentTarget.classList.remove('drop');let id=Number(e.dataTransfer.getData('text/plain'));if(id&&me().hand.some(c=>c.uid===id)){selected=id;playSelected()}}
function playSelected(){if(onlineMode&&!myOnlineTurn())return;if(choiceBusy)return;hideActions();if(task)return;let p=me(),c=p.hand.find(x=>x.uid===selected);if(!c){toast('Select a card in your hand or drag it onto your battlefield.');return}if(!canPay(c.cost)){toast('Not enough Influence, Faith, or Coins.');return}if(c.keywords?.includes('Legendary')&&p.board.some(x=>x.name===c.name)){toast('You already control this Legendary card.');return}startTransaction();choosePayment(c.cost,()=>completePlay(c,p));return}
function completePlay(c,p){p.hand.splice(p.hand.indexOf(c),1);selected=null;if(c.type==='event'){p.discard.push(c);eventEffect(c,p)}else{enter(c,p)}say(`${p.name} played ${c.name}.`);render();if(!task)commitTransaction()}
function enter(c,p){c.damage=0;c.power=0;c.corrupt=!!c.enterCorrupt;c.exhausted=c.type!=='location'&&!c.keywords?.includes('Haste');c.evasiveUsed=false;p.board.push(c);if(c.deploy==='coins2')p.coins+=2;if(c.deploy==='draw')draw(p);if(c.deploy==='blast2')queueChoice({kind:'blast',pIndex:S.players.indexOf(p),amount:2})}
function warp(c,p){if(!p.board.includes(c))return;p.board.splice(p.board.indexOf(c),1);for(let q of S.players)for(let x of q.board)if(x.leaveDraw)draw(q);if(c.leaveDraw)draw(p);enter(c,p);say(`${c.name} Warped: leaves and re-enters with full Health.`)}
let transaction=null;
function startTransaction(){if(!transaction)transaction={state:structuredClone(S),selected,history:[...history]}}
function commitTransaction(){if(!task){transaction=null;updateActionPanel()}}
function cancelTarget(){if(choiceBusy){choiceBusy=false;pendingChoices=[]}if(transaction){S=transaction.state;selected=transaction.selected;history=transaction.history;$('log').textContent=history[0]||''}transaction=null;task=null;rehireState=null;closeDialog();hideActions();render();updateActionPanel()}
function updateActionPanel(){let panel=$('actionpanel');if(!panel)return;if(!task){panel.classList.remove('active');panel.innerHTML='';return}panel.classList.add('active');panel.innerHTML=`<div class="actionheading">✦ ACTION IN PROGRESS</div><div class="actiondescription">${task.message}</div><div class="actionnote">Click a highlighted card to continue. You can cancel without spending resources or exhausting cards.</div><button class="danger" onclick="cancelTarget()">✕ Cancel action</button>`}
function promptTarget(message,filter,pick){startTransaction();task={message,filter,pick:(c,p)=>{task=null;pick(c,p);render();if(!task)commitTransaction();updateActionPanel()}};hideActions();render();updateActionPanel()}
function damage(c,n,kind='ability'){if(!owner(c))return;if(kind==='characterCombat'&&c.keywords?.includes('Impenetrable'))return;if(['characterCombat','vesselCombat'].includes(kind)&&c.keywords?.includes('Evasive')&&!c.evasiveUsed){c.evasiveUsed=true;say(`${c.name} evades the first attack.`);return}c.damage+=n;if(c.damage>=hp(c))destroy(c)}
function queueChoice(choice){pendingChoices.push(choice);if(!choiceBusy)processChoices()}
function processChoices(){if(choiceBusy||!pendingChoices.length||!S)return;choiceBusy=true;let q=pendingChoices.shift(),p=S.players[q.pIndex];if(q.kind==='priest'){
 const choices=p.deck.filter(c=>c.type==='vessel'&&!(c.keywords?.includes('Legendary')&&p.board.some(x=>x.name===c.name)));
 if(!choices.length){choiceBusy=false;processChoices();return}
 dialog(`<h2>${p.name} — Last Stand: Priest</h2><p>Choose a Vessel from your deck to put directly into play for free.</p><div class="discardlist">${choices.map(c=>`<button class="discardrow" onclick="resolvePriest(${q.pIndex},${c.uid})"><b>${c.name}</b><span>${costText(c)} · ${c.atk}/${c.hp}</span></button>`).join('')}</div>`);return;
 }if(q.kind==='bounty'){
 dialog(`<h2>${p.name} — Bounty Hunter Last Stand</h2><p>Spend 3 Coins to return Bounty Hunter to play? You have ${p.coins} Coins.</p><div class="choices"><button class="primary" ${p.coins<3?'disabled':''} onclick="resolveBounty(${q.pIndex},${q.uid},true)">Pay 3 Coins & return</button><button onclick="resolveBounty(${q.pIndex},${q.uid},false)">Decline — leave in discard</button></div>`);return;
 }if(q.kind==='blast'){promptTarget('Consumed Vessel — Deploy: choose any card to deal 2 damage.',(c,p)=>!!p,c=>{damage(c,2);choiceBusy=false;processChoices()});return}
 if(q.kind==='daemonBlast'){if(!all().some(({c})=>c.type==='vessel')){choiceBusy=false;say('Daemon Ship: no Vessel available to damage.');processChoices();return}promptTarget('Daemon Ship — Discard trigger: choose a Vessel to deal 2 damage.',(c,p)=>c.type==='vessel',c=>{damage(c,2);choiceBusy=false;processChoices()});return}
 if(q.kind==='discard'){if(!p.hand.length){choiceBusy=false;processChoices();return}dialog(`<h2>${p.name} — Discard a card</h2><p>Choose a card to discard for Hellish Mothership.</p><div class="discardlist">${p.hand.map(c=>`<button class="discardrow" onclick="resolveDiscardChoice(${q.pIndex},${c.uid})">${c.name} <span>${costText(c)}</span></button>`).join('')}</div>`);return}
 choiceBusy=false;processChoices()}
function choiceDone(){choiceBusy=false;closeDialog();render();processChoices()}
function resolvePriest(index,id){let p=S.players[index],i=p.deck.findIndex(c=>c.uid===id&&c.type==='vessel');if(i>=0){let [c]=p.deck.splice(i,1);enter(c,p);shuffle(p.deck);say(`${p.name} summoned ${c.name} for free.`)}choiceDone()}
function resolveBounty(index,id,yes){let p=S.players[index],i=p.discard.findIndex(c=>c.uid===id);if(yes&&p.coins>=3&&i>=0){p.coins-=3;let [c]=p.discard.splice(i,1);enter(c,p);say(`${p.name} returned Bounty Hunter for 3 Coins.`)}choiceDone()}
function resolveDiscardChoice(index,id){let p=S.players[index],i=p.hand.findIndex(c=>c.uid===id);if(i>=0)discardCard(p,p.hand[i]);choiceDone()}
function destroy(c,depth=0){let p=owner(c);if(!p||depth>12)return;let idx=S.players.indexOf(p);p.board.splice(p.board.indexOf(c),1);say(`${c.name} was destroyed.`);
 const voids=all().filter(({c:x})=>x.leaveDraw).map(({c:x,p:q})=>q);for(let q of voids)draw(q);if(c.leaveDraw)draw(p);
 if(c.last==='eternal'){let sacrifice=p.board.find(x=>x.uid!==c.uid);if(sacrifice){destroy(sacrifice,depth+1);enter(c,p);return}}
 if(c.last==='mothership'&&p.hand.length){enter(c,p);queueChoice({kind:'discard',pIndex:idx});return}
 if(c.last==='banished'){c.damage=0;c.corrupt=false;c.power=0;p.hand.push(c);draw(p);return}
 p.discard.push(c);
 if(c.last==='draw2')draw(p,2);
 if(c.last==='priest')queueChoice({kind:'priest',pIndex:idx});
 if(c.last==='bounty'&&p.coins>=3)queueChoice({kind:'bounty',pIndex:idx,uid:c.uid});
}
function attackSelected(){if(onlineMode&&!myOnlineTurn())return;if(choiceBusy)return;hideActions();if(task)return;let a=me().board.find(x=>x.uid===selected);if(!a||!['character','vessel'].includes(a.type)||a.exhausted||a.cannotAttack){toast('Select a ready Character or Vessel that can attack.');return}startTransaction();let guards=them().board.filter(c=>c.keywords?.includes('Guardian'));promptTarget('Choose an enemy card to attack. Guardians must be attacked first.',(c,p)=>p===them()&&(!guards.length||guards.includes(c)),t=>{a.exhausted=true;if(a.combatCoin)me().coins++;if(a.attackCoins)me().coins+=a.attackCoins;if(t.combatCoin)them().coins++;let aHit=atk(a),tHit=t.type==='location'?0:atk(t);damage(t,aHit,a.type==='character'?'characterCombat':'vesselCombat');if(owner(a))damage(a,tHit,t.type==='character'?'characterCombat':'vesselCombat');if(a.attackTrigger==='discard')queueChoice({kind:'discard',pIndex:1-S.active});if(a.attackTrigger==='blast'&&owner(a))promptTarget('Eternal Vessel: deal 3 damage to any target.',(c,p)=>!!p,c=>damage(c,3));say(`${a.name} attacks ${t.name}.`)})}
function magicSelected(){let c=me().board.find(x=>x.uid===selected);if(!c||c.exhausted||!c.magicGen){toast('This card cannot generate Magic.');return}c.exhausted=true;me().magic+=c.magicGen;render()}
function discardCard(p,c){let i=p.hand.indexOf(c);if(i<0)return;hideActions();if(selected===c.uid)selected=null;p.hand.splice(i,1);p.chaos++;if(c.discardDeploy)enter(c,p);else p.discard.push(c);for(let x of p.board)if(x.discardPower)x.power++;for(let x of [...p.board])if(x.discardBlast)queueChoice({kind:'daemonBlast',pIndex:S.players.indexOf(p),sourceId:x.uid});say(`${p.name} discarded ${c.name} and gained 1 Chaos.`)}
function discardSelected(){if(onlineMode&&!myOnlineTurn())return;hideActions();let c=me().hand.find(x=>x.uid===selected);if(!c){toast('Select a card in your hand to discard.');return}discardCard(me(),c);selected=null;render()}
function chooseCoinTarget(message,amount,done){me().coins+=amount;if(done)done(null);render()}

function choosePower(message,except){promptTarget(message,(c,p)=>p&&p.board.includes(c)&&['character','vessel'].includes(c.type)&&c!==except,c=>{if(owner(c))c.power++})}
function activateSelected(paid=false){if(onlineMode&&!myOnlineTurn())return;if(choiceBusy)return;hideActions();if(task)return;let c=me().board.find(x=>x.uid===selected);if(!c||!c.act){toast('Select a card with an activated ability.');return}if(c.act==='market'){dialog(`<h2>Star Market</h2><div class="choices"><button onclick="marketOption('draw')">3 Coins: Draw 1</button><button onclick="marketOption('coin')">2 Influence: Gain 1 Coin</button><button onclick="marketOption('power')">1 Influence + 1 Coin: Power Token</button></div><button onclick="closeDialog()">Cancel</button>`);return}if(c.act==='guard'){activateVaultGuard(c);return}
if(c.exhausted){toast('This card is exhausted.');return}
if(!paid){if(!canPay(c.actCost)){toast('Cannot pay ability cost.');return}startTransaction();choosePayment(c.actCost,()=>activateSelected(true));return}c.exhausted=true;switch(c.act){case 'coin':me().coins++;break;case 'influence':me().inf++;break;case 'draw':draw(me());break;case 'selfHeal':c.damage=0;break;case 'avenger':promptTarget('Deal 1 damage to any card.',(t,p)=>!!p,t=>{damage(t,1);chooseHeal('Heal 2 to one card you control.',2)});break;case 'power':choosePower('Place a Power Token on a Character or Vessel.');break;case 'star':draw(me());promptTarget('Deal 2 damage to a Vessel.',(t,p)=>t.type==='vessel',t=>damage(t,2));break;case 'pirate':promptTarget('Place a Power Token on a Character.',(t,p)=>t.type==='character',t=>{t.power++});break;case 'invest':me().coins+=2;break;case 'bank':draw(me());break;case 'cannons':promptTarget('Deal 3 damage to a card without Evasive.',(t,p)=>!t.keywords?.includes('Evasive'),t=>damage(t,3));break;case 'selfWarp':warp(c,me());break;case 'blackSun':{let targets=all().map(x=>x.c);for(let t of targets)damage(t,1);break}case 'chaosPower':promptTarget('Choose a Character for a Power Token.',(t,p)=>t.type==='character',t=>{t.power++});break;case 'buried':me().coins++;promptTarget('Ready an exhausted Character.',(t,p)=>p===me()&&t.type==='character'&&t.exhausted,t=>{t.exhausted=false});break}render();if(!task)commitTransaction()}

function activateVaultGuard(guard){
  // Exhausting a Vault is the cost; the Guard remains ready, so this can be used repeatedly.
  const vaults=me().board.filter(x=>x.type==='location'&&x.sub.split(',').map(y=>y.trim()).includes('Vault')&&!x.exhausted);
  if(me().coins<1){toast('Vault Guard requires 1 Coin.');return}
  if(!vaults.length){toast('Vault Guard requires a ready Vault you control.');return}
  startTransaction();
  promptTarget('Vault Guard: select one of your READY Vaults to exhaust. Spend 1 Coin to give Vault Guard a Power Token.',
    (target,controller)=>controller===me()&&vaults.some(v=>v.uid===target.uid)&&!target.exhausted,
    (vault)=>{
      if(me().coins<1||vault.exhausted||!owner(guard)){say('Vault Guard ability could not resolve.');return}
      vault.exhausted=true;
      me().coins-=1;
      guard.power+=1;
      say(`Exhausted ${vault.name}, spent 1 Coin, and gave Vault Guard a Power Token.`);
    });
}
function marketOption(option){closeDialog();let c=me().board.find(x=>x.uid===selected);if(!c||c.name!=='Star Market')return;if(option==='draw'){choosePayment(G(3),()=>draw(me()));return}if(option==='coin'){if(!pay(I(2)))return toast('Need 2 Influence.');me().coins++}if(option==='power'){choosePayment(mix(1,0,1),()=>choosePower('Choose a Character or Vessel for a Power Token.'));return}render()}
function vaultMove(dir){closeDialog();let c=me().board.find(x=>x.uid===selected);if(!c)return;promptTarget('Choose another card to move one Coin '+(dir==='out'?'to':'from')+'.',(t,p)=>t!==c&&(dir==='out'?c.coins>0:t.coins>0),t=>{if(dir==='out'){c.coins--;t.coins++}else{t.coins--;c.coins++}})}
function eventEffect(c,p){switch(c.event){case 'pray':draw(p,2);break;case 'undying':p.board.forEach(x=>x.damage=0);draw(p);break;case 'healing':promptTarget('Restore a card to full Health and remove its Corruption.',(t,q)=>!!q,t=>{t.damage=0;t.corrupt=false});break;case 'flame':promptTarget('Deal 3 damage to any card.',(t,q)=>!!q,t=>{damage(t,3);choosePower('Place a Power Token on a different Character or Vessel.',t)});break;case 'condemn':corruptNext(2);break;case 'trade':p.coins++;promptTarget('Warp a card. It re-enters with full Health and without tokens.',(t,q)=>!!q,(t,q)=>warp(t,q));break;case 'assassin':promptTarget('Deal 5 damage to a Character.',(t,q)=>t.type==='character',t=>damage(t,5));break;case 'inventory':draw(p,3);chooseHeal('Heal 5 damage from a card you control.',5);break;case 'rehire':startRehire(p);break;case 'ritePower':promptTarget('Choose a Character to receive 2 Power Tokens.',(t,q)=>t.type==='character',t=>t.power+=2);break;case 'voidEnergy':promptTarget('Deal 4 damage to any card.',(t,q)=>!!q,t=>damage(t,4));break;case 'desicrate':draw(p,4);break;case 'darkness':p.board.filter(t=>['character','vessel'].includes(t.type)).forEach(t=>t.power++);break}}
function tradeTransfer(n){closeDialog();chooseCoinTarget('Choose a card to receive '+n+' Coins.',n)}
// Discard piles are public information and can be viewed during either turn.
function showDiscard(index){
 const p=S.players[index]; const items=p.discard.slice().reverse();
 dialog(`<h2>${p.name} — Discard Pile (${items.length})</h2><p>All discarded and destroyed cards are shown here. Click a card name to read its ability.</p><div class="discardlist">${items.length?items.map(c=>`<button class="discardrow" onclick="inspectDiscard(${index},${c.uid})"><span><b>${c.name}</b><small>${c.type.toUpperCase()} · ${c.sub||'—'}</small></span><span>${costText(c)}</span></button>`).join(''):'<p>No cards in this discard pile yet.</p>'}</div><button class="primary" onclick="closeDialog()">Close</button>`)
}
function inspectDiscard(index,id){let c=S.players[index].discard.find(x=>x.uid===id);if(!c)return;dialog(`<h2>${c.name}</h2><p><b>${c.type.toUpperCase()} — ${c.sub||'—'}</b> · ${costText(c)}</p><p>${c.text}</p><p>${c.type==='event'?'Event':`Attack ${c.atk} / Health ${c.hp}`}</p><div class="choices"><button onclick="showDiscard(${index})">Back to discard pile</button><button onclick="closeDialog()">Close</button></div>`)}
let rehireState=null;
function startRehire(p){
 rehireState={p,chosen:[]};renderRehire();
}
function renderRehire(){
 let q=rehireState;if(!q)return;
 const available=q.p.discard.filter(c=>c.type==='character');
 dialog(`<h2>Re-hire — Return Characters</h2><p>Choose up to <b>2 Characters</b> from your discard pile to return to your hand. Selected: <b>${q.chosen.length}/2</b>.</p>${available.length?`<div class="discardlist">${available.map(c=>`<button class="discardrow ${q.chosen.includes(c.uid)?'chosen':''}" onclick="toggleRehire(${c.uid})"><span><b>${q.chosen.includes(c.uid)?'✓ ':''}${c.name}</b><small>${c.sub} · ${c.atk}/${c.hp} · ${c.text}</small></span><span>${costText(c)}</span></button>`).join('')}</div>`:'<p><b>No Characters in your discard pile.</b> Re-hire cannot return Events, Locations, or Vessels. The Event has resolved and was placed in your discard pile.</p>'}<div class="choices"><button class="primary" onclick="confirmRehire()">${available.length?'Return selected Characters':'Done'}</button></div>`)
}
function toggleRehire(id){let q=rehireState;if(!q)return;let c=q.p.discard.find(c=>c.uid===id&&c.type==='character');if(!c)return;let i=q.chosen.indexOf(id);if(i>=0)q.chosen.splice(i,1);else if(q.chosen.length<2)q.chosen.push(id);renderRehire()}
function confirmRehire(){let q=rehireState;if(!q)return;let moved=[];for(let id of q.chosen){let i=q.p.discard.findIndex(c=>c.uid===id&&c.type==='character');if(i<0)continue;let c=q.p.discard.splice(i,1)[0];c.damage=0;c.power=0;c.corrupt=false;c.exhausted=false;moved.push(c);q.p.hand.push(c)}rehireState=null;closeDialog();say(`Re-hire returned ${moved.length} Character${moved.length===1?'':'s'} to hand.`);render()}
function corruptNext(n){if(n<=0)return;let candidates=all().filter(({c})=>!c.corrupt);if(!candidates.length)return;promptTarget('Place a Corruption token on an uncorrupted card ('+n+' remaining).',(c,p)=>!c.corrupt,(c)=>{c.corrupt=true;corruptNext(n-1)})}
function dialog(s){$('dialog').innerHTML=s;$('overlay').classList.remove('hidden')}function closeDialog(){$('overlay').classList.add('hidden');if(onlineMode&&onlinePhase==='game'&&myOnlineTurn())publishOnline()}function toast(s){dialog(`<h2>Notice</h2><p>${s}</p><button class="primary" onclick="closeDialog()">OK</button>`)}function restart(){dialog('<h2>New match?</h2><p>Shuffle both 40-card decks and restart.</p><button class="primary" onclick="newGame()">Start new match</button> <button onclick="closeDialog()">Cancel</button>')}
function showRules(){dialog(`<h2>Prosperity — Playtest Rules</h2><p><b>Victory:</b> Begin your turn with 8 uncorrupted Characters, Vessels, or Locations in play.</p><p><b>Pass & play:</b> Each player selects one of three 40-card decks, and mirror matches are allowed. Each player gets one free partial mulligan. Draw 5 cards initially, then 1 card at the beginning of subsequent turns. Maximum Influence grows by 1 per turn (cap 10).</p><p><b>Playing cards:</b> Drag from hand onto your battlefield, or click a hand card and press Play. Influence is spent; Faith is a threshold, not spent; Coins are kept in your personal pool and persist between turns. Cards without Influence costs may be played for 0 Influence.</p><p><b>Actions:</b> Select a ready unit, then Attack or Ability. Exhausted units still defend. Characters and Vessels retain damage; Locations heal at the end of every turn.</p><p><b>Keywords:</b> Guardian must be attacked first; Evasive ignores first attack damage each turn; Impenetrable prevents <b>Character combat damage only</b>; Legendary limits you to one same-name card in play; Power Tokens give +1 Attack and maximum Health; Warp removes a card and re-enters it with full Health, no Corruption, no Power Tokens, and triggers Deploy.</p><p><b>Prototype conventions:</b> You may target any card unless an effect says otherwise. No reactions, no hand limit, no deck-out loss. Coins are spent directly from your personal pool. Discarding generates Chaos, Void cards use Chaos costs. Discard a card to gain 1 Chaos; Chaos expires at the end of the turn.</p><button class="primary" onclick="closeDialog()">Return to match</button>`)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&task)cancelTarget()});

// Online beta uses Realtime Presence and broadcasts match snapshots. Not a secure competitive backend.
const SUPABASE_URL='https://oytorqlqhyrecmoqlqjp.supabase.co';
const SUPABASE_PUBLIC_KEY='sb_publishable_AnzO8b7Ho0QjV779wFvqig_M2w6YFKE';
let onlineClient=null,onlineChannel=null,onlineRoom='',onlineRole='',onlineId='',onlineDeck=0,onlineConnected=false;
let onlineMode=false,onlineSeat=-1,onlineRevision=0,onlinePublishing=false,onlineReceiving=false,onlineTimer=null,onlinePhase='lobby';
function myOnlineTurn(){return !onlineMode || (S&&S.active===onlineSeat)}
function onlineWait(message){
 hideActions();selected=null;task=null;updateActionPanel();
 dialog(`<h2>🌐 Prosperity — Online Match</h2><p>${message}</p><p>Room <b>${onlineRoom}</b> · You are Player ${onlineSeat+1}.</p><p>Keep this tab open. The battlefield updates when your opponent acts.</p><button onclick="showOnlineStatus()">Refresh status</button>`);
}
function showOnlineStatus(){if(!S)return; if(onlinePhase==='mulligan')showMulliganHandoff();else if(myOnlineTurn()){closeDialog();render()}else onlineWait('Waiting for your opponent to finish their turn.');}
function publishOnline(force=false){
 if(!onlineMode||!onlineConnected||onlineReceiving||!S||(!myOnlineTurn()&&!force))return;
 if(onlineTimer)clearTimeout(onlineTimer);
 onlineTimer=setTimeout(async()=>{
  if(!onlineChannel||!onlineConnected||!S||onlineReceiving)return;
  const payload={revision:++onlineRevision,phase:onlinePhase,seat:onlineSeat,state:structuredClone(S),uid,history:history.slice(0,12),mulliganIndex};
  try{await onlineChannel.send({type:'broadcast',event:'match-state',payload})}catch(e){console.warn('Match sync failed',e)}
 },force?0:90);
}
function receiveOnline(payload){
 if(!onlineMode||!payload||payload.seat===onlineSeat||payload.revision<=onlineRevision)return;
 const previousActive=S?.active,previousPhase=onlinePhase;onlineReceiving=true;
 try{
  onlineRevision=payload.revision;onlinePhase=payload.phase;S=payload.state;uid=payload.uid;history=payload.history||[];mulliganIndex=payload.mulliganIndex??0;
  selected=null;task=null;transaction=null;pendingChoices=[];choiceBusy=false;rehireState=null;
  hideActions();updateActionPanel();render();
  if(onlinePhase==='mulligan')showMulliganHandoff();
  else if(onlinePhase==='game'){
   if(S.over)dialog(`<h2>🏆 Match finished</h2><p>${S.players[S.active].name} won.</p><button onclick="leaveOnline();newGame()">Main menu</button>`);
   else if(myOnlineTurn()){if(previousActive!==S.active||previousPhase!=='game')beginTurn();else closeDialog();}
   else onlineWait('Waiting for your opponent to finish their turn.');
  }
 }finally{onlineReceiving=false;if(onlineMode&&onlinePhase==='game'&&myOnlineTurn()&&(previousActive!==S.active||previousPhase!=='game'))publishOnline(true)}
}
function startOnlineMatch(){
 if(onlineRole!=='host')return;
 const members=onlineMembers(),guest=members.find(m=>m.role==='guest');
 if(!guest)return onlineError('Wait for a guest to join before starting.');
 const host=members.find(m=>m.role==='host');
 setupChoices=[host?.deck??onlineDeck,guest.deck];uid=0;
 S={players:setupChoices.map((v,i)=>player(`Player ${i+1} · ${deckOptions[v].name}`,deckOptions[v].cards())),active:0,round:0,over:false};
 S.players.forEach(p=>draw(p,5));mulliganIndex=0;onlinePhase='mulligan';onlineRevision=0;
 publishOnline(true);showMulliganHandoff();
}

function onlineError(message){const e=$('onlineError');if(e)e.textContent=message;else say(message)}
function leaveOnline(){if(onlineTimer)clearTimeout(onlineTimer);onlineMode=false;onlinePhase='lobby';onlineSeat=-1;if(onlineChannel&&onlineClient){onlineClient.removeChannel(onlineChannel)}onlineChannel=null;onlineRoom='';onlineRole='';onlineConnected=false}
async function ensureOnlineClient(){
 if(onlineClient)return onlineClient;
 if(!window.supabase?.createClient)throw Error('Supabase library could not load. Check your internet connection.');
 onlineClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLIC_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
 return onlineClient;
}
function makeRoomCode(){const alphabet='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let bytes=new Uint8Array(7);crypto.getRandomValues(bytes);return [...bytes].map(v=>alphabet[v%alphabet.length]).join('')}
function lobbyUrl(){const u=new URL(location.href);u.searchParams.set('room',onlineRoom);return u.href}
async function createOnlineRoom(){await connectOnline(makeRoomCode(),'host')}
async function joinOnlineRoom(){let c=($('joinCode')?.value||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');if(c.length!==7){onlineError('Enter a seven-character room code.');return}await connectOnline(c,'guest')}
async function connectOnline(code,role){
 try{
  await ensureOnlineClient();leaveOnline();onlineRoom=code;onlineRole=role;onlineId=crypto.randomUUID();onlineDeck=role==='host'?setupChoices[0]:setupChoices[1];onlineConnected=false;onlineMode=true;onlineSeat=role==='host'?0:1;onlinePhase='lobby';onlineRevision=0;
  showOnlineLobby('Connecting to room…');
  onlineChannel=onlineClient.channel('prosperity-lobby-'+code,{config:{presence:{key:onlineId}}});
  onlineChannel.on('presence',{event:'sync'},()=>{if(onlinePhase==='lobby')refreshOnlineLobby()});
  onlineChannel.on('broadcast',{event:'match-state'},({payload})=>receiveOnline(payload));
  onlineChannel.on('broadcast',{event:'request-state'},()=>{if(onlineMode&&S&&myOnlineTurn())publishOnline(true)});
  onlineChannel.subscribe(async status=>{
   if(status==='SUBSCRIBED'){
    onlineConnected=true;
    await onlineChannel.track({id:onlineId,role:onlineRole,deck:onlineDeck,joinedAt:Date.now()});
    refreshOnlineLobby();
    if(role==='guest')onlineChannel.send({type:'broadcast',event:'request-state',payload:{}});
   }else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'){
    onlineError('Connection failed. Check Supabase Realtime and your internet connection.');
   }
  });
 }catch(e){leaveOnline();showSetup();onlineError('Unable to connect: '+e.message)}
}
function onlineMembers(){if(!onlineChannel)return [];return Object.values(onlineChannel.presenceState()).flat()}
function refreshOnlineLobby(){if(!onlineRoom)return;const members=onlineMembers(),hosts=members.filter(m=>m.role==='host'),guests=members.filter(m=>m.role==='guest');
 if(onlineRole==='guest'&&onlineConnected&&!hosts.length){showOnlineLobby('Waiting for the host. Check the code if nobody appears.');return}
 showOnlineLobby(hosts.length&&guests.length?'Both players connected! Select your decks.':'Waiting for another player to join…');
}
function showOnlineLobby(status){
 const members=onlineMembers(),hosts=members.filter(m=>m.role==='host'),guests=members.filter(m=>m.role==='guest');
 const options=deckOptions.map((d,i)=>`<option value="${i}" ${onlineDeck===i?'selected':''}>${d.name}</option>`).join('');
 dialog(`<h2>🌐 Prosperity — Online Lobby</h2><p class="online-status">${status}</p><div class="online-box"><div>Room code</div><div class="online-code">${onlineRoom}</div><div class="online-row"><button onclick="copyRoomCode()">Copy code</button><button onclick="copyInviteLink()">Copy invitation link</button></div><p class="online-url">${lobbyUrl().replace(/&/g,'&amp;')}</p><p>Host: <b>${hosts.length?'Connected':'Not connected'}</b> · Guest: <b>${guests.length?'Connected':'Not connected'}</b></p><label>Your deck: <select onchange="setOnlineDeck(Number(this.value))">${options}</select></label><p class="online-status">Deck choices: ${members.map(m=>(m.role==='host'?'Host':'Guest')+' — '+deckOptions[m.deck]?.name).join(' · ')||'Waiting for connection'}</p></div><p><b>Online beta:</b> The game state synchronizes between devices and hides the other hand in the interface. This is a trusted-friends prototype: hidden cards are not protected from technical inspection, and the server does not yet validate moves. Do not use for competitive play.</p>${onlineRole==='host'?`<button class="primary" onclick="startOnlineMatch()" ${!hosts.length||!guests.length?'disabled':''}>▶ Start online match</button>`:'<p>Waiting for host to start the match.</p>'}<button onclick="leaveOnline();showSetup()">← Back to game setup</button>`)
}
async function setOnlineDeck(index){onlineDeck=index;if(onlineChannel&&onlineConnected){await onlineChannel.track({id:onlineId,role:onlineRole,deck:onlineDeck,joinedAt:Date.now()});refreshOnlineLobby()}}
function copyRoomCode(){navigator.clipboard?.writeText(onlineRoom).then(()=>onlineError('Room code copied.')).catch(()=>onlineError('Copy the room code displayed above.'))}
function copyInviteLink(){navigator.clipboard?.writeText(lobbyUrl()).then(()=>onlineError('Invite link copied.')).catch(()=>onlineError('Copy the invitation link displayed above.'))}
function resumeInvite(){let code=new URLSearchParams(location.search).get('room');if(code&&/^[A-Z2-9]{7}$/.test(code.toUpperCase())){showSetup();let el=$('joinCode');if(el){el.value=code.toUpperCase();onlineError('Invitation detected. Click Join room to connect.')}}}

 newGame();
 resumeInvite();
 </script></body></html>
