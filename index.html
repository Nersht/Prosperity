 const start=cardBox(attackerId),finish=cardBox(targetId);
 if(!start||!finish)return;
 if(kind==='vessel')beamVolley34(attackerId,targetId);
 const source=document.querySelector(`[data-card-uid="${attackerId}"]`);
 if(!source)return;
 const ghost=source.cloneNode(true);ghost.removeAttribute('onclick');ghost.removeAttribute('data-card-uid');
 Object.assign(ghost.style,{position:'fixed',left:start.left+'px',top:start.top+'px',width:start.width+'px',height:start.height+'px',margin:'0',zIndex:'1002',pointerEvents:'none',transform:'none',filter:'drop-shadow(0 0 12px #ffd778)'});
 document.body.appendChild(ghost);
 const dx=(finish.left+finish.width/2)-(start.left+start.width/2),dy=(finish.top+finish.height/2)-(start.top+start.height/2);
 const duration=window.matchMedia('(prefers-reduced-motion: reduce)').matches?160:1000;
 if(kind==='character')shakeBattlefield36(Math.min(10,Math.max(1,damageAmount)*1.7),370,480);
 const frames=kind==='vessel'?[{transform:'translate(0,0) scale(1)',opacity:1},{transform:'translate(0,0) scale(1.07)',opacity:1,offset:.25},{transform:'translate(0,0) scale(1)',opacity:.15,offset:.6},{transform:'translate(0,0)',opacity:0,offset:1}]:[{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${-dx*.13}px,${-dy*.13}px) rotate(-6deg) scale(.93)`,opacity:1,offset:.27},{transform:`translate(${dx*.72}px,${dy*.72}px) scale(1.1)`,opacity:1,offset:.57},{transform:`translate(${dx*.88}px,${dy*.88}px) scale(1.02)`,opacity:.9,offset:.65},{transform:'translate(0,0) scale(1)',opacity:0,offset:1}];
 ghost.animate(frames,{duration,easing:'ease-in-out'}).finished.finally(()=>ghost.remove());
 const flash=document.createElement('div');flash.className='combat-impact';flash.textContent=blocked?'BLOCKED':damageAmount?'−'+damageAmount:'MISS';
 flash.style.left=(finish.left+finish.width/2)+'px';flash.style.top=(finish.top+finish.height/2)+'px';document.body.appendChild(flash);
 flash.animate([{opacity:0,transform:'translate(-50%,-50%) scale(.5)'},{opacity:1,transform:'translate(-50%,-75%) scale(1.25)',offset:.4},{opacity:0,transform:'translate(-50%,-120%) scale(1)'}],{duration,easing:'ease-out'}).finished.finally(()=>flash.remove());
 const target=document.querySelector(`[data-card-uid="${targetId}"]`);
 if(target)target.animate([{filter:'brightness(1)'},{filter:blocked?'brightness(1.6)':'brightness(1.8) sepia(1) saturate(4)',offset:.55},{filter:'brightness(1)'}],{duration});
}

p,c=>damage(c,2));say(`${a.name} attacks ${t.name}.`)})}

let activeAbilitySource=null;function activateSelected(paid=false){if(onlineMode&&!myOnlineTurn())return;if(choiceBusy)return;hideActions();if(task)return;let c=me().board.find(x=>x.uid===selected);if(!c||!c.act){toast('Select a card with an activated ability.');return}if(c.act==='readySelf'){if(!canPay(c.actCost))return toast('Not enough Influence or Faith.');pay(c.actCost);c.exhausted=false;render();return}if(c.act==='gainInfluence2'){if(c.exhausted||faith(me())<4)return;c.exhausted=true;me().inf+=2;render();return}if(c.act==='selfGuardian'){if(me().trophies<1)return;me().trophies-=1;if(!c.keywords.includes('Guardian'))c.keywords.push('Guardian');c.temporaryGuardianUntil=me().turns+1;c.temporaryGuardianGrantedBy=S.active;render();return}if(c.act==='blueStar'){if(c.exhausted)return;showBlueStar(c);return}if(c.act==='fortress'||c.act==='redDwarf'){if(!canPay(c.act==='fortress'?{t:3}:{t:2}))return toast('Not enough Trophies.');if(c.act==='fortress'){me().trophies-=3;me().board.filter(t=>t.type==='character').forEach(t=>t.power++)}else{me().trophies-=2;draw(me())}render();return}if(c.act==='market'){dialog(`<h2>Star Market</h2><div class="choices"><button onclick="marketOption('draw')">3 Influence: Draw 1</button><p>Coins can pay Influence costs while Star Market is in play.</p></div><button onclick="closeDialog()">Cancel</button>`);return}if(c.act==='highPriest'||c.act==='chieftainPower'){let cost=c.act==='highPriest'?{f:4}:{t:2};if(!canPay(cost))return;startTransaction();promptTarget(c.act==='highPriest'?'Choose a READY card to exhaust and give a Power Token.':'Choose a card to receive a Power Token.',(t,p)=>!!p&&(c.act!=='highPriest'||!t.exhausted),t=>{if(!canPay(cost))return;pay(cost);if(c.act==='highPriest')t.exhausted=true;t.power++;render()});return}if(c.act==='guard'){activateVaultGuard(c);return}if(c.act==='ghouls'){if(c.exhausted)return;c.exhausted=true;showGhouls(c);return}
if(c.exhausted&&/\bExhaust\b/i.test(c.text)){toast('This card is exhausted.');return}
activeAbilitySource=c.uid;if(!paid){if(!canPay(c.actCost)){toast('Cannot pay ability cost.');return}startTransaction();choosePayment(c.actCost,()=>activateSelected(true));return}if(/\bExhaust\b/i.test(c.text))c.exhausted=true;switch(c.act){case 'coin':me().coins++;break;case 'slaveSelfPower':c.power++;break;case 'slaveAnyPower':promptTarget('Choose any card to receive a Power Token.',(t,q)=>!!q,t=>t.power++);break;case 'influence':me().inf++;break;case 'draw':draw(me());break;case 'magic1':me().magic++;break;case 'magic2':me().magic+=2;break;case 'asteroid':promptTarget('Give a Character or Vessel Guardian until your next turn.',(t,q)=>!!q&&['character','vessel'].includes(t.type),t=>{t.keywords=t.keywords||[];if(!t.keywords.includes('Guardian')){t.nativeGuardian=false;t.keywords.push('Guardian');t.temporaryGuardianGrantedBy=S.active;t.temporaryGuardianUntil=me().turns+1}else if(t.temporaryGuardianUntil){t.temporaryGuardianGrantedBy=S.active;t.temporaryGuardianUntil=me().turns+1}});break;case 'tribal':promptTarget('Give any card 1 Power Token.',(t,q)=>!!q,t=>t.power+=1);break;case 'readyCharacter':promptTarget('Ready a Character.',(t,q)=>t.type==='character'&&t.exhausted,t=>t.exhausted=false);break;case 'chieftain':{let choices=me().discard.filter(t=>t.type==='character'&&t.sub.includes('Warrior'));dialog(`<h2>Return a Warrior to hand</h2>${choices.map(t=>`<button onclick="retrieveWarrior(${t.uid})">${t.name}</button>`).join('')||'No Warriors in discard'}`);break}case 'fortress':if(me().trophies>=3){me().trophies-=3;me().board.filter(t=>t.type==='character').forEach(t=>t.power++)}break;case 'redDwarf':if(me().trophies>=2){me().trophies-=3;draw(me())}break;case 'churchBlast':promptTarget(c.name+': deal 2 damage to any target.',(t,p)=>!!p,t=>damage(t,2));break;case 'pyro':promptTarget('Deal 3 damage to any card without Guardian.',(t,p)=>!!p&&!t.keywords?.includes('Guardian'),t=>damage(t,3));break;case 'ghouls':showGhouls(c);break;case 'blueStar':showBlueStar(c);break;c function retrieveWarrior(id){let p=me(),i=p.discard.findIndex(c=>c.uid===id);if(i>=0){let [c]=p.discard.splice(i,1);c.exhausted=false;p.hand.push(c)}closeDialog();render()}
function showGhouls(c){const max=me().magic;dialog(`<h2>Summoned Ghouls</h2><p>Spend X Magic to give this card X Power Tokens.</p><div class="choices">${Array.from({length:max+1},(_,i)=>`<button onclick="ghoulsSpend(${c.uid},${i})">${i} Magic → ${i} Tokens</button>`).join('')}</div>`)}
function ghoulsSpend(id,n){if(onlineMode&&!myOnlineTurn())return;const c=me().board.find(c=>c.uid===id);if(!c||n>me().magic)return;me().magic-=n;c.power+=n;closeDialog();render()}
function showBlueStar(c){dialog(`<h2>Blue Star</h2><div class="choices"><button onclick="blueStarAction(${c.uid},'draw')">Exhaust: Draw 1 card</button><button ${me().magic<2?'disabled':''} onclick="blueStarAction(${c.uid},'blast')">Exhaust, 2 Magic: Deal 2 damage</button></div><button onclick="closeDialog()">Cancel</button>`)}
function blueStarAction(id,mode){if(onlineMode&&!myOnlineTurn())return;const c=me().board.find(c=>c.uid===id);if(!c||c.exhausted)return;if(mode==='blast'){if(me().magic<2)return;me().magic-=2;c.exhausted=true;closeDialog();promptTarget('Blue Star: Deal 2 damage to any target.',(t,p)=>!!p,t=>damage(t,2))}else{c.exhausted=true;draw(me());closeDialog();render()}}
function startSiphon(p){const other=S.players[1-S.players.indexOf(p)];const choices=other.discard.filter(c=>c.type==='event'&&c.name!=='Power Siphon');if(!choices.length){say('Power Siphon: opponent has no eligible Events in discard.');return}dialog(`<h2>Power Siphon</h2><p>Choose an Event from your opponent’s discard pile to play for free. You may play additional Events after resolving this one.</p><div class="discardlist">${choices.map(c=>`<button class="discardrow" onclick="siphonPlay(${c.uid})">${c.name} · ${c.text}</button>`).join('')}</div><button onclick="closeDialog()">Done</button>`)}
function siphonPlay(id){if(onlineMode&&!myOnlineTurn())return;const p=me(),o=them(),i=o.discard.findIndex(c=>c.uid===id&&c.type==='event');if(i<0)return;const [c]=o.discard.splice(i,1);p.discard.push(c);closeDialog();eventEffect(c,p);say(`${p.name} played ${c.name} from the opponent's discard pile for free.`);render()}
function activateVaultGuard(guard){if(onlineMode&&!myOnlineTurn())return;
  // Exhausting a Vault is the cost; the Guard remains ready, so this can be used repeatedly.
  const vaults=me().board.filter(x=>x.type==='location'&&x.sub.split(',').map(y=>y.trim()).includes('Vault')&&!x.exhausted);
  if(me().coins<1){toast('Vault Guard requires 1 Coin.');return}
  if(!vaults.length){toast('Vault Guard requires a ready Vault you control.');return}
  startTransaction();
  promptTarget('Vault Guard: select one of your READY Vaults to exhaust. Spend 1 Coin to give Vault Guard a Power Token.',
    (target,controller)=>controller===me()&&vaults.some(v=>v.uid===target.uid)&&!target.exhausted,
    (vault)=>{
      if(me().coins<1||vault.exhausted||!owner(guard)){say('Vault Guard ability could not resolve.');return}
      vault.exhausted=true;
      me().coins-=1;
      guard.power+=1;
      say(`Exhausted ${vault.name}, spent 1 Coin, and gave Vault Guard a Power Token.`);
    });
}
function marketOption(option){if(onlineMode&&!myOnlineTurn())return;closeDialog();let c=me().board.find(x=>x.uid===selected);if(!c||c.name!=='Star Market')return;if(option==='draw'){choosePayment(I(3),()=>draw(me()));return}if(option==='coin'){if(!pay(I(2)))return toast('Need 2 Influence.');me().coins++}if(option==='power'){choosePayment(mix(1,0,1),()=>choosePower('Choose a Character or Vessel for a Power Token.'));return}render()}

function eventEffect(c,p){switch(c.event){case 'pray':draw(p,2);break;case 'undyingReturn':startResurrection(p);break;case 'healingPower':promptTarget('Put '+(c.powerAmount||2)+' Power Tokens on a card and remove all its Corruption.',(t,q)=>!!q,t=>{t.power+=(c.powerAmount||2);t.corrupt=false});break;case 'lash':promptTarget('Lash: deal 5 damage to any target.',(t,q)=>!!q,t=>damage(t,5));break;case 'forcedLabor':promptTarget('Forced Labor: take control of a Character and corrupt it.',(t,q)=>!!q&&t.type==='character'&&q!==p&&!(t.keywords||[]).includes('Legendary'),(t,q)=>{q.board.splice(q.board.indexOf(t),1);p.board.push(t);t.corrupt=true;t.exhausted=true;say(`${p.name} gained control of ${t.name}.`)});break;case 'flame':promptTarget('Deal 4 damage to any card.',(t,q)=>!!q,t=>{damage(t,4);choosePower('Place a Power Token on a different Character or Vessel.',t)});break;case 'condemn':corruptNext(1);break;case 'trade':p.coins++;promptTarget('Warp a card. It re-enters with full Health and without tokens.',(t,q)=>!!q,(t,q)=>warp(t,q));break;case 'assassin':promptTarget('Deal 5 damage to a Character.',(t,q)=>t.type==='character',t=>damage(t,5));break;case 'inventoryPower':draw(p,3);promptTarget('Put a Power Token on any card.',(t,q)=>!!q,t=>t.power++);break;case 'rehire':startRehire(p);break;case 'magicRite':promptTarget('Put 3 Power Tokens on a card.',(t,q)=>!!q,t=>{t.power+=3;draw(p)});break;case 'study':draw(p,3);break;case 'siphon':startSiphon(p);break;case 'ritePower':promptTarget('Choose a Character to receive 4 Power Tokens.',(t,q)=>t.type==='character',t=>t.power+=4);break;case 'magicFlame':promptTarget('Deal 5 damage to any card.',(t,q)=>!!q,t=>damage(t,5));break;case 'voidEnergy':promptTarget('Deal 4 damage to any card.',(t,q)=>!!q,t=>damage(t,4));break;case 'desicrate':draw(p,5);break;case 'savageRite':promptTarget('Corrupt one of your cards and give it 3 Power Tokens.',(t,q)=>q===p,t=>{t.corrupt=true;t.power+=3});break;case 'kranCharge':{let n=p.board.filter(t=>t.type==='character'&&t.sub.includes('Warrior')).length;promptTarget('Deal '+n+' damage to any target.',(t,q)=>!!q,t=>damage(t,n));break}case 'thousandBlades':p.board.filter(t=>t.type==='character').forEach(t=>t.exhausted=false);break;case 'darkness':p.board.filter(t=>['character','vessel'].includes(t.type)).forEach(t=>t.power++);break}}

// Discard piles are public information and can be viewed during either turn.
function showDiscard(index){

}
function inspectDiscard(index,id){let c=S.players[index].discard.find(x=>x.uid===id);if(!c)return;dialog(`<h2>${c.name}</h2><p><b>${c.type.toUpperCase()} — ${c.sub||'—'}</b> · ${costText(c)}</p><p>${c.text}</p><p>${c.type==='event'?'Event':`Attack ${c.atk} / Health ${c.hp}`}</p><div class="choices"><button onclick="showDiscard(${index})">Back to discard pile</button><button onclick="closeDialog()">Close</button></div>`)}
let rehireState=null;
function startRehire(p){
 rehireState={p,chosen:[]};renderRehire();
}
function renderRehire(){
 let q=rehireState;if(!q)return;
 const available=q.p.discard.filter(c=>c.type==='character');
 dialog(`<h2>Re-hire — Return Characters</h2><p>Choose up to <b>2 Characters</b> from your discard pile to return to your hand. Selected: <b>${q.chosen.length}/2</b>.</p>${available.length?`<div class="discardlist">${available.map(c=>`<button class="discardrow ${q.chosen.includes(c.uid)?'chosen':''}" onclick="toggleRehire(${c.uid})"><span><b>${q.chosen.includes(c.uid)?'✓ ':''}${c.name}</b><small>${c.sub} · ${c.atk}/${c.hp} · ${c.text}</small></span><span>${costText(c)}</span></button>`).join('')}</div>`:'<p><b>No Characters in your discard pile.</b> Re-hire cannot return Events, Locations, or Vessels. The Event has resolved and was placed in your discard pile.</p>'}<div class="choices"><button class="primary" onclick="confirmRehire()">${available.length?'Return selected Characters':'Done'}</button></div>`)

function toggleRehire(id){let q=rehireState;if(!q)return;let c=q.p.discard.find(c=>c.uid===id&&c.type==='character');if(!c)return;let i=q.chosen.indexOf(id);if(i>=0)q.chosen.splice(i,1);else if(q.chosen.length<2)q.chosen.push(id);renderRehire()}
function confirmRehire(){let q=rehireState;if(!q)return;let moved=[];for(let id of q.chosen){let i=q.p.discard.findIndex(c=>c.uid===id&&c.type==='character');if(i<0)continue;let c=q.p.discard.splice(i,1)[0];c.damage=0;c.power=0;c.corrupt=false;c.exhausted=false;moved.push(c);q.p.hand.push(c)}rehireState=null;closeDialog();say(`Re-hire returned ${moved.length} Character${moved.length===1?'':'s'} to hand.`);render()}
function startResurrection(p){
 const index=S.players.indexOf(p);
 const options=p.discard.filter(c=>c.type!=='event'&&!(c.keywords?.includes('Legendary')&&p.board.some(x=>x.name===c.name)));
 if(!options.length){say('Undying Faith: no eligible card in discard.');return}
 dialog(`<h2>Undying Faith — Return a Card to Play</h2><p>Select a Character, Vessel, or Location from your discard pile.</p><div class="discardlist">${options.map(c=>`<button class="discardrow" onclick="resolveResurrection(${index},${c.uid})"><b>${c.name}</b><span>${costText(c)}</span></button>`).join('')}</div>`);
}
function resolveResurrection(index,id){
 if(onlineMode&&!myOnlineTurn())return;
 const p=S.players[index];if(p!==me())return;
 const i=p.discard.findIndex(c=>c.uid===id&&c.type!=='event'&&!(c.keywords?.includes('Legendary')&&p.board.some(x=>x.name===c.name)));
 if(i<0)return;
 const [c]=p.discard.splice(i,1);enter(c,p);say(`Undying Faith returned ${c.name} to play.`);closeDialog();render();

 const previousActive=S?.active,previousPhase=onlinePhase;const prevEvent=S?.eventFx?.id,prevAbility=S?.abilityFx?.id;const incomingFx=payload.state.attackFx;const showIncomingFx=incomingFx&&incomingFx.id!==S?.attackFx?.id; if(showIncomingFx)combatAnimation(incomingFx.attacker,incomingFx.target,incomingFx.kind,incomingFx.damage,incomingFx.blocked);if(payload.state.abilityFx&&payload.state.abilityFx.id!==prevAbility&&payload.state.abilityFx.seat!==onlineSeat){abilityOrbAnimation(payload.state.abilityFx);abilityDamageAnimation(payload.state.abilityFx.target,payload.state.abilityFx.damage)}onlineReceiving=true;

function leaveOnline(){const b=$('onlineTurnBanner');if(b)b.classList.add('hidden');for(const button of document.querySelectorAll('.toolbar button'))button.disabled=false;if(onlineTimer)clearTimeout(onlineTimer);onlineMode=false;onlinePhase='lobby';onlineSeat=-1;onlineStateVersion=0;if(onlineChannel&&onlineClient){onlineClient.removeChannel(onlineChannel)}onlineChannel=null;onlineRoom='';onlineRole='';onlineConnected=false}

function makeRoomCode(){const alphabet='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let bytes=new Uint8Array(7);crypto.getRandomValues(bytes);return [...bytes].map(v=>alphabet[v%alphabet.length]).join('')}

async function connectOnline(code,role){
 try{
  await ensureOnlineClient();leaveOnline();onlineRoom=code;onlineRole=role;onlineId=crypto.randomUUID();onlineDeck=role==='host'?setupChoices[0]:setupChoices[1];onlineConnected=false;onlineMode=true;onlineSeat=role==='host'?0:1;onlinePhase='lobby';onlineRevision=0;onlineSeenRevisions=[-1,-1];onlineStateVersion=0;
